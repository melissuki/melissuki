<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" fill="none" role="img" aria-label="Hi, I'm Melis">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#c084fc;#a855f7" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#ec4899">
        <animate attributeName="offset" values="0.28;0.72;0.28" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#67e8f9;#22d3ee" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0f0a1e"/>
      <stop offset="55%"  stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#08141a"/>
    </linearGradient>

    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ec4899" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="6" y="6" width="988" height="248" rx="26"/>
    </clipPath>
  </defs>

  <rect x="6" y="6" width="988" height="248" rx="26" fill="url(#panel)"/>

  <g clip-path="url(#card)">
    <rect x="6" y="6" width="988" height="248" fill="url(#grid)"/>

    <circle cx="160" cy="70" r="190" fill="url(#blobA)">
      <animate attributeName="cy" values="70;120;70" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="200" r="200" fill="url(#blobB)">
      <animate attributeName="cy" values="200;150;200" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.75;1" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="250" r="170" fill="url(#blobC)">
      <animate attributeName="cx" values="540;620;540" dur="15s" repeatCount="indefinite"/>
    </circle>

    <g fill="#22d3ee">
      <rect x="905" y="52" width="9" height="9" rx="2" opacity="0.8">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="925" y="72" width="9" height="9" rx="2" opacity="0.5">
        <animate attributeName="opacity" values="0.9;0.15;0.9" dur="4.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="885" y="88" width="9" height="9" rx="2" opacity="0.35">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g fill="#a855f7">
      <rect x="70" y="196" width="9" height="9" rx="2" opacity="0.6">
        <animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="94" y="212" width="9" height="9" rx="2" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="6.75" y="6.75" width="986.5" height="246.5" rx="25.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="78" font-size="13" font-weight="600" letter-spacing="6.5" fill="#7d8590">
      İSTANBUL · TÜRKİYE
    </text>

    <text x="500" y="150" font-size="60" font-weight="800" letter-spacing="-1" fill="url(#neon)" filter="url(#glow)">
      Hi, I&#8217;m Melis
    </text>

    <text x="500" y="192" font-size="16" font-weight="500" letter-spacing="3.6" fill="#c9d1d9">
      SOFTWARE ENGINEERING STUDENT
      <tspan fill="#ec4899"> · </tspan>
      FRONTEND DEVELOPER
    </text>
  </g>

  <rect x="360" y="214" width="280" height="2.5" rx="1.25" fill="url(#neon)" opacity="0.9"/>
</svg>
