<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" fill="none" role="img" aria-label="Hi, I'm Melis — Software Engineering Student and Frontend Developer">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#c084fc;#a855f7" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ec4899">
        <animate attributeName="offset" values="0.28;0.72;0.28" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#67e8f9;#22d3ee" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a1e"/>
      <stop offset="55%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#08141a"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-70%" width="160%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1.4" fill="#ffffff" fill-opacity="0.022"/>
    </pattern>

    <clipPath id="card">
      <rect x="6" y="6" width="988" height="268" rx="26"/>
    </clipPath>
  </defs>

  <rect x="6" y="6" width="988" height="268" rx="26" fill="url(#panel)"/>

  <g clip-path="url(#card)">
    <rect x="6" y="6" width="988" height="268" fill="url(#grid)"/>

    <circle cx="160" cy="76" r="200" fill="url(#blobA)">
      <animate attributeName="cy" values="76;130;76" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="215" r="210" fill="url(#blobB)">
      <animate attributeName="cy" values="215;160;215" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.75;1" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="270" r="180" fill="url(#blobC)">
      <animate attributeName="cx" values="540;620;540" dur="15s" repeatCount="indefinite"/>
    </circle>

    <rect x="6" y="6" width="988" height="268" fill="url(#scan)"/>

    <rect x="6" y="-60" width="988" height="60" fill="url(#sweep)">
      <animate attributeName="y" values="-60;280;-60" dur="9s" repeatCount="indefinite"/>
    </rect>

    <g fill="#22d3ee">
      <rect x="905" y="52" width="9" height="9" rx="2" opacity="0.8">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="925" y="72" width="9" height="9" rx="2" opacity="0.5">
        <animate attributeName="opacity" values="0.9;0.15;0.9" dur="4.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="885" y="88" width="9" height="9" rx="2" opacity="0.35">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g fill="#a855f7">
      <rect x="70" y="206" width="9" height="9" rx="2" opacity="0.6">
        <animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="94" y="224" width="9" height="9" rx="2" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="6.75" y="6.75" width="986.5" height="266.5" rx="25.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="500" y="76" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="6.5" fill="#7d8590">
      İSTANBUL · TÜRKİYE
    </text>

    <!-- glitch layers + main title -->
    <g font-size="66" font-weight="800" text-anchor="middle">
      <text x="496" y="164" fill="#22d3ee" opacity="0.6" textLength="430" lengthAdjust="spacing">
        Hi, I&#8217;m Melis
        <animate attributeName="x" values="496;496;496;486;505;493;496;496;496"
                 keyTimes="0;0.40;0.42;0.435;0.45;0.465;0.48;0.50;1"
                 dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="504" y="164" fill="#ec4899" opacity="0.6" textLength="430" lengthAdjust="spacing">
        Hi, I&#8217;m Melis
        <animate attributeName="x" values="504;504;504;514;495;507;504;504;504"
                 keyTimes="0;0.40;0.42;0.435;0.45;0.465;0.48;0.50;1"
                 dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="164" fill="url(#neon)" filter="url(#glow)" textLength="430" lengthAdjust="spacing">
        Hi, I&#8217;m Melis
      </text>
    </g>

    <!-- blinking cursor -->
    <rect x="726" y="140" width="15" height="32" rx="2" fill="#ec4899">
      <animate attributeName="opacity" values="1;1;0.1;0.1;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="500" y="220" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="3.6" fill="#c9d1d9">
      SOFTWARE ENGINEERING STUDENT
      <tspan fill="#ec4899"> · </tspan>
      FRONTEND DEVELOPER
    </text>
  </g>

  <rect x="360" y="244" width="280" height="2.5" rx="1.25" fill="url(#neon)" opacity="0.9"/>
</svg>
